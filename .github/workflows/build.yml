name: Build APKs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Ambil binary ngrok (arm64) untuk Server APK
        run: |
          mkdir -p server/src/main/jniLibs/arm64-v8a
          curl -fL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-arm64.tgz | tar xz -C /tmp
          cp /tmp/ngrok server/src/main/jniLibs/arm64-v8a/libngrok.so
          curl -fL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64 -o server/src/main/jniLibs/arm64-v8a/libcloudflared.so
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CloudPhone-Server-APK
          path: server/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CloudPhone-Controller-APK
          path: controller/build/outputs/apk/debug/*.apk
